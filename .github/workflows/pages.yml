# Publishes the password-protected demo to GitHub Pages. Runs only when started by hand:
# Actions › Deploy to GitHub Pages › Run workflow.
#
# One-time setup:
#   1. Settings › Secrets and variables › Actions › New repository secret: DEMO_PASSWORD
#      (10 characters or more; four random words is a good shape).
#   2. Settings › Pages › Build and deployment › Source: GitHub Actions.
# To change the password, update the secret and run the workflow again; the old one stops working.

name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
